[package]
name = "kv-agent"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
getrandom = "0.2"
kv-crypto = { path = "../kv-crypto" }
kv-approvals = { path = "../kv-approvals" }
kv-broker = { path = "../kv-broker" }
kv-proto = { path = "../kv-proto" }
kv-store = { path = "../kv-store" }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.3"
sha2 = "0.10"
subtle = "2"
thiserror = "2"

[dev-dependencies]
kv-test-support = { path = "../kv-test-support" }
rcgen = "0.13"
url = "2.5"

[target.'cfg(unix)'.dependencies]
kv-audit = { path = "../kv-audit" }
rustix = { version = "1", features = ["fs", "net", "process"] }

[lints]
workspace = true
