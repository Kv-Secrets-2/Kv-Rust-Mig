[package]
name = "kv-agent"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
getrandom = "0.2"
kv-crypto = { path = "../kv-crypto" }
kv-approvals = { path = "../kv-approvals" }
kv-proto = { path = "../kv-proto" }
kv-store = { path = "../kv-store" }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.3"
sha2 = "0.10"
subtle = "2"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "net", "process"] }

[lints]
workspace = true
