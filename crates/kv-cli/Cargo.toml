[package]
name = "kv-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kv"
path = "src/main.rs"

[dependencies]
kv-mcp = { path = "../kv-mcp" }
kv-store = { path = "../kv-store" }
kv-crypto = { path = "../kv-crypto" }
kv-proto = { path = "../kv-proto" }
kv-broker = { path = "../kv-broker" }
kv-audit = { path = "../kv-audit" }
serde_json = "1"
caseless = "0.2.2"
unicode-general-category = "1"
zeroize = "1"
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process", "termios", "stdio"] }

[dev-dependencies]
kv-test-support = { path = "../kv-test-support" }

[lints]
workspace = true
