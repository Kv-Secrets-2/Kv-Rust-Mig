[package]
name = "kv-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
kv-mcp = { path = "../kv-mcp" }

[dev-dependencies]
kv-test-support = { path = "../kv-test-support" }
