[package]
name = "kv-grants"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
kv-approvals = { path = "../kv-approvals" }
kv-store = { path = "../kv-store" }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
kv-test-support = { path = "../kv-test-support" }
tempfile = "3"
serde = "1"
