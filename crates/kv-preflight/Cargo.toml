[package]
name = "kv-preflight"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
kv-sandbox = { path = "../kv-sandbox" }
kv-hook = { path = "../kv-hook" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
ruff_python_parser = { version = "=0.0.21", features = ["stacker"] }
ruff_python_ast = "=0.0.21"
unicode-normalization = "0.1"
num-bigint = "0.4"
num-traits = "0.2"
getrandom = "0.2"
hex = "0.4"
kv-store = { path = "../kv-store" }
kv-approvals = { path = "../kv-approvals" }

[dev-dependencies]
kv-test-support = { path = "../kv-test-support" }
tempfile = "3"
