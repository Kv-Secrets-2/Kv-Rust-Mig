[package]
name = "kv-proto"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
kv-store = { path = "../kv-store" }
kv-approvals = { path = "../kv-approvals" }
kv-crypto = { path = "../kv-crypto" }
getrandom = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process", "net", "event"] }

[dev-dependencies]
kv-test-support = { path = "../kv-test-support" }

[lints]
workspace = true
