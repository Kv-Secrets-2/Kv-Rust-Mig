[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.5.0-dev"
license = "MIT"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"

# Owner-terminal integration flows repeatedly unwrap vault keys. Keep scrypt's
# memory-hard mixing optimized even in debug builds; unoptimized scrypt otherwise
# makes correct passphrase verification look like a stalled terminal for minutes.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
