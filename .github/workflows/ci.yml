name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run native tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/kv-native-tests.log"
        env:
          TMPDIR: ${{ runner.os == 'Windows' && runner.temp || '/var/tmp' }}
          CARGO_TERM_COLOR: never
      - name: Report native failure identifiers
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "kv-native-tests.log"
          if log.is_file():
              text = log.read_text(errors="replace")
              tracked = subprocess.check_output(["git", "ls-files", "-z", "crates"], text=True).split("\0")
              public_functions = set()
              source_lines = {}
              for path in tracked:
                  if path.endswith(".rs"):
                      source = subprocess.check_output(["git", "show", "HEAD:" + path], text=True)
                      source_lines[path] = len(source.splitlines())
                      public_functions.update(re.findall(r"\bfn\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(", source))
              failed = set(re.findall(r"^test ([A-Za-z_][A-Za-z0-9_:]*) \.\.\. FAILED$", text, re.MULTILINE))
              failed = sorted({name.rsplit("::", 1)[-1] for name in failed} & public_functions)
              codes = sorted(set(re.findall(r"^error\[(E[0-9]{4})\]", text, re.MULTILINE)))
              sites = set(re.findall(r"panicked at (crates/[A-Za-z0-9_/.-]+\.rs):([0-9]+):[0-9]+:", text))
              sites = sorted((path, int(line)) for path, line in sites
                             if path in source_lines and 1 <= int(line) <= source_lines[path])
              kinds = sorted(set(re.findall(r"kind: (TimedOut|WouldBlock|Interrupted|InvalidInput|UnexpectedEof|BrokenPipe|ConnectionReset|NotConnected|Other)\b", text)))
              # Publish only fixed error kinds and identifiers/locations from public source.
              # Never include raw log lines, paths, assertion values or environment data.
              message = json.dumps({"compiler_codes": codes, "failed_tests": failed, "panic_sites": sites, "io_error_kinds": kinds}, ensure_ascii=True)
              print("::error title=Native failure identifiers::" + message)
          PY

  parity:
    name: parity (${{ matrix.python }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10.22"
            mode: canonical
          - python: "3.11"
            mode: semantic
          - python: "3.12"
            mode: semantic
          - python: "3.13"
            mode: semantic
    steps:
      - name: Require reference read credential
        env:
          HAS_REFERENCE_TOKEN: ${{ secrets.KV_REFERENCE_READ_TOKEN != '' }}
        run: |
          if [ "$HAS_REFERENCE_TOKEN" != "true" ]; then
            echo "::error::KV_REFERENCE_READ_TOKEN is unavailable. Configure the repository Actions secret; fork and Dependabot pull requests may not receive it. Validate reviewed changes on a trusted branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pinned Python reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kv-Secrets-2/kv-secrets
          ref: 9a497d91a0f6e95b0949deaf8f5c431f9a4333c0
          path: .parity-reference
          token: ${{ secrets.KV_REFERENCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install and select the reference
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/kv-reference"
          "$RUNNER_TEMP/kv-reference/bin/python" -m pip install ./.parity-reference cryptography==50.0.2
          printf 'KV_PY_REF=%s\n' "$RUNNER_TEMP/kv-reference/bin/python" >> "$GITHUB_ENV"
      - name: Check the gate's negative controls
        run: python -I scripts/test_parity_gate.py
      - name: Require executed Python comparisons and reverse crypto checks
        env:
          TMPDIR: /var/tmp
        run: >-
          python -I scripts/parity_gate.py
          --reference-repo .parity-reference
          --python-version '${{ matrix.python }}'
          --mode '${{ matrix.mode }}'
          --output '${{ runner.temp }}/parity-results'
      - name: Retain the inventory and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: parity-${{ matrix.python }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/parity-results
          if-no-files-found: error

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
