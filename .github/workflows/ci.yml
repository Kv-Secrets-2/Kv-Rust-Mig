name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run native tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/kv-native-tests.log"
        env:
          TMPDIR: ${{ runner.os == 'Windows' && runner.temp || '/var/tmp' }}
          CARGO_TERM_COLOR: never
      - name: Run fixed operation loopback tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/v1-anthropic-operation.log"
          cargo test -p kv-cli --locked --features test-provider-loopback --test v1_anthropic_operation 2>&1 | tee "$log"
          python - <<'PYEOF'
          import re
          from pathlib import Path
          import os

          text = (Path(os.environ["RUNNER_TEMP"]) / "v1-anthropic-operation.log").read_text(errors="replace")
          running = [int(count) for count in re.findall(r"^running (\d+) tests?$", text, re.MULTILINE)]
          summaries = re.findall(
              r"^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out",
              text,
              re.MULTILINE,
          )
          if not running or len(running) != len(summaries):
              raise SystemExit("fixed-operation guard failed: could not prove a nonempty test execution")
          if sum(running) == 0:
              raise SystemExit("fixed-operation guard failed: cargo selected zero tests")
          passed = sum(int(summary[1]) for summary in summaries)
          failed = sum(int(summary[2]) for summary in summaries)
          if failed != 0 or any(summary[0] != "ok" for summary in summaries):
              raise SystemExit("fixed-operation guard failed: one or more selected tests failed")
          if passed == 0:
              raise SystemExit("fixed-operation guard failed: all selected tests were ignored")
          PYEOF
        env:
          TMPDIR: /var/tmp
          CARGO_TERM_COLOR: never
      - name: Report native failure identifiers
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "kv-native-tests.log"
          if log.is_file():
              text = log.read_text(errors="replace")
              tracked = subprocess.check_output(["git", "ls-files", "-z", "crates"], text=True, encoding="utf-8", errors="replace").split("\0")
              public_functions = set()
              source_lines = {}
              for path in tracked:
                  if path.endswith(".rs"):
                      source = subprocess.check_output(["git", "show", "HEAD:" + path], text=True, encoding="utf-8", errors="replace")
                      source_lines[path] = len(source.splitlines())
                      public_functions.update(re.findall(r"\bfn\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(", source))
              failed = set(re.findall(r"^test ([A-Za-z_][A-Za-z0-9_:]*) \.\.\. FAILED$", text, re.MULTILINE))
              failed = sorted({name.rsplit("::", 1)[-1] for name in failed} & public_functions)
              codes = sorted(set(re.findall(r"^error\[(E[0-9]{4})\]", text, re.MULTILINE)))
              sites = set(re.findall(r"panicked at (crates/[A-Za-z0-9_/.-]+\.rs):([0-9]+):[0-9]+:", text))
              sites = sorted((path, int(line)) for path, line in sites
                             if path in source_lines and 1 <= int(line) <= source_lines[path])
              kinds = sorted(set(re.findall(r"kind: (TimedOut|WouldBlock|Interrupted|InvalidInput|UnexpectedEof|BrokenPipe|ConnectionReset|NotConnected|Other)\b", text)))
              # Publish only fixed error kinds and identifiers/locations from public source.
              # Never include raw log lines, paths, assertion values or environment data.
              message = json.dumps({"compiler_codes": codes, "failed_tests": failed, "panic_sites": sites, "io_error_kinds": kinds}, ensure_ascii=True)
              print("::error title=Native failure identifiers::" + message)
          PY

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version "=0.22.2"
      - name: Audit workspace lockfile
        run: cargo audit --file Cargo.lock --color never
